# Refreshes data/scholar.js (Google Scholar citations) and data/github.js
# (pinned repositories) every week. To run it right away:
# Actions tab > "Update Scholar and GitHub data" > Run workflow.

name: Update Scholar and GitHub data

on:
  schedule:
    - cron: "30 6 * * 1"   # Mondays, 06:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch Google Scholar numbers
        run: python scripts/update_scholar.py

      - name: Fetch pinned GitHub repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_github.py

      - name: Save changes
        run: |
          if git diff --quiet -- data/; then
            echo "No changes to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update Scholar and GitHub data"
          git push
